name: desktop build

on:
  pull_request:
    paths:
      - desktop/**
      - .github/actions/setup-desktop/**
      - .github/workflows/desktop-build.yml
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      # format, lint and type checks run in their own workflow
      - run: vp build
      - run: vp pack
