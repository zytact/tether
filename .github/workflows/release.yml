name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft GitHub release. Leave off for a dry run that only uploads the bundles as workflow artifacts.
        type: boolean
        default: false
      tag:
        description: Tag to publish under (e.g. v0.1.0). Required only when publish is on.
        type: string
        default: ""

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb + rpm
          - platform: ubuntu-22.04
          # dmg
          - platform: macos-latest
          # exe (NSIS installer)
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - if: env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch' && inputs.tag == ''
        shell: bash
        run: |
          echo "::error::publish is on but no tag was given"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The release is named after the tag, so a tag ahead of the app version would publish bundles that
      # report an older version.
      - if: env.PUBLISH == 'true' && startsWith(matrix.platform, 'ubuntu')
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the app version $version"
            exit 1
          fi

      - uses: ./.github/actions/setup-frontend

      # electron-builder assembles the rpm with rpmbuild.
      - if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get install -y rpm

      - run: vp run package

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/tether/*.deb
            release/tether/*.rpm
            release/tether/*.dmg
            release/tether/*-setup.exe

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -t assets < <(find bundles -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --title "Tether $TAG" --verify-tag --generate-notes
          fi
