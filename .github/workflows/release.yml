name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft GitHub release. Leave off for a dry run that only uploads the bundles as workflow artifacts.
        type: boolean
        default: false
      tag:
        description: Tag to publish under (e.g. v3.2.0). Required only when publish is on.
        type: string
        default: ""

permissions:
  contents: read

concurrency: release

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  bundle:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb + rpm
          - platform: ubuntu-22.04
          # dmg to install, tar.gz for the updater
          - platform: macos-latest
          # exe (NSIS installer)
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - if: env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch' && inputs.tag == ''
        shell: bash
        run: |
          echo "::error::publish is on but no tag was given"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref }}

      # latest.json takes its version from the tag, so a tag ahead of the app version would offer an
      # update that installs the same build again.
      - if: env.PUBLISH == 'true' && startsWith(matrix.platform, 'ubuntu')
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the app version $version"
            exit 1
          fi

      - uses: ./.github/actions/setup-frontend

      # electron-builder assembles the rpm with rpmbuild.
      - if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get install -y rpm

      - run: vp run package

      - if: startsWith(matrix.platform, 'ubuntu')
        run: |
          if rpm -qpl release/tether/*.rpm | grep -q '^/usr/lib/.build-id/'; then
            echo "::error::RPM contains global build-id links"
            exit 1
          fi

      # The updater installs only bundles signed with the release key. Without it the bundles still
      # build, but publishing fails for want of signatures.
      - shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set, so the bundles are unsigned"
            exit 0
          fi
          shopt -s nullglob
          node scripts/sign-update.ts release/tether/*.deb release/tether/*.rpm release/tether/*.tar.gz release/tether/*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/tether/*.deb
            release/tether/*.rpm
            release/tether/*.dmg
            release/tether/*.tar.gz
            release/tether/*-setup.exe
            release/tether/*.sig

  publish:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    needs: [release-please, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref_name }}
        # latest.json is what installed apps read from the latest release. Each platform key names
        # the bundle that app was installed from, so an rpm install never downloads the deb.
        run: |
          shopt -s nullglob
          platforms='{}'
          for bundle in bundles/*.deb bundles/*.rpm bundles/*.tar.gz bundles/*-setup.exe; do
            name=$(basename "$bundle")
            [ -f "$bundle.sig" ] || { echo "::error::$name is not signed"; exit 1; }
            case "$name" in
              *_amd64.deb) key=linux-x86_64-deb ;;
              *.x86_64.rpm) key=linux-x86_64-rpm ;;
              *.tar.gz) key=darwin-aarch64 ;;
              *-setup.exe) key=windows-x86_64 ;;
              *) echo "::error::no updater platform for $name"; exit 1 ;;
            esac
            platforms=$(jq --arg key "$key" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
              --rawfile signature "$bundle.sig" '.[$key] = {url: $url, signature: ($signature | rtrimstr("\n"))}' <<<"$platforms")
          done
          node scripts/release-policy.ts "$TAG" "$GH_REPO" bundles/update-policy.json
          jq -n --arg version "${TAG#v}" --argjson platforms "$platforms" --slurpfile policy bundles/update-policy.json \
            '{version: $version, platforms: $platforms} + $policy[0]' > bundles/latest.json
          rm bundles/update-policy.json

          mapfile -t assets < <(find bundles -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --title "Tether $TAG" --verify-tag --generate-notes
          fi
