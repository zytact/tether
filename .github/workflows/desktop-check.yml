name: desktop check

on:
  pull_request:
    paths:
      - desktop/**
      - .github/actions/setup-desktop/**
      - .github/workflows/desktop-check.yml
  workflow_dispatch:

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - run: vp check
