name: desktop test

on:
  pull_request:
    paths:
      - desktop/**
      - .github/actions/setup-desktop/**
      - .github/workflows/desktop-test.yml
  workflow_dispatch:

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - run: vp test
